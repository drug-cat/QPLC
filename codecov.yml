# codecov.yml — code coverage reporting
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70..100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 70%
        threshold: 1%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true
  require_base: yes
  require_head: yes
