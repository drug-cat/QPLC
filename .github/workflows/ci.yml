name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cpp-windows:
    name: C++ (Windows MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Upload qplc.exe
        uses: actions/upload-artifact@v4
        with:
          name: qplc-windows
          path: build/qplc.exe

  build-cpp-ubuntu:
    name: C++ (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Upload qplc
        uses: actions/upload-artifact@v4
        with:
          name: qplc-linux
          path: build/qplc

  build-dotnet:
    name: .NET (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build QPLC.Core
        run: dotnet build QPLC.Core/QPLC.Core.csproj

      - name: Build QPLCSimulator
        run: dotnet build QPLCSimulator/QPLCSimulator.csproj

      - name: Test simulator end-to-end
        run: |
          ./build/qplc examples/conf.qplc examples/main.q -o /tmp/main.xml
          dotnet QPLCSimulator/bin/Debug/net8.0/QPLCSimulator.dll \
            examples/conf.qplc /tmp/main.xml < <(printf 'set enable True\nrun\nexit\n')
