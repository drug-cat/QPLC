name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cpp-windows:
    name: C++ (Windows MSYS2)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --verbose

      - name: Verify binary
        run: ./build/qplc.exe --version || true

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Upload qplc.exe
        uses: actions/upload-artifact@v7
        with:
          name: qplc-windows
          path: build/qplc.exe
          retention-days: 7

  build-cpp-ubuntu:
    name: C++ (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --verbose

      - name: Verify binary
        run: ./build/qplc --version || true

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Upload qplc
        uses: actions/upload-artifact@v7
        with:
          name: qplc-linux
          path: build/qplc
          retention-days: 7

  build-dotnet:
    name: .NET (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-cpp-ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Download qplc (Linux)
        uses: actions/download-artifact@v8
        with:
          name: qplc-linux
          path: build

      - name: Make qplc executable
        run: chmod +x build/qplc

      - name: Verify qplc
        run: ./build/qplc --version || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build QPLC.Core
        run: dotnet build QPLC.Core/QPLC.Core.csproj --configuration Release

      - name: Build QPLCSimulator
        run: dotnet build QPLCSimulator/QPLCSimulator.csproj --configuration Release

      - name: Test simulator end-to-end
        run: |
          ./build/qplc examples/conf.qplc examples/main.q -o /tmp/main.xml
          dotnet QPLCSimulator/bin/Release/net8.0/QPLCSimulator.dll \
            examples/conf.qplc /tmp/main.xml < <(printf 'set enable True\nrun\nexit\n')
